<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Yudistira Firman Syah — Full-Stack Developer">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#50fa7b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#50fa7b" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#0a0a0a"/>
  <rect x="28" y="24" width="1144" height="272" rx="10" fill="url(#win)" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="28" y="24" width="1144" height="40" rx="10" fill="#111111"/>
  <rect x="28" y="54" width="1144" height="10" fill="#111111"/>
  <circle cx="54" cy="44" r="6" fill="#ff5555"/>
  <circle cx="76" cy="44" r="6" fill="#ffcc00"/>
  <circle cx="98" cy="44" r="6" fill="#50fa7b"/>
  <line x1="28" y1="64" x2="1172" y2="64" stroke="#2a2a2a" stroke-width="1"/>
  <text x="600" y="49" text-anchor="middle" font-family="monospace" font-size="12" fill="#666666">yudistira@terminal:~</text>

  <!-- prompt line -->
  <text x="60" y="106" font-family="monospace" font-size="15" fill="#00ff00">yudistira@terminal:~$</text>
  <text x="256" y="106" font-family="monospace" font-size="15" fill="#ffcc00">whoami</text>

  <!-- identity -->
  <text x="60" y="146" font-family="monospace" font-size="30" font-weight="bold" fill="#8cc2ff">Yudistira Firman Syah</text>
  <text x="60" y="176" font-family="monospace" font-size="15" fill="#50fa7b">Full-Stack Developer · PHP/Laravel · Vue · WordPress · APIs &amp; AI</text>

  <!-- proof line -->
  <text x="60" y="222" font-family="monospace" font-size="15" fill="#666666">yudistira@terminal:~$</text>
  <text x="256" y="222" font-family="monospace" font-size="15" fill="#ffcc00">ls -l ~/proof</text>

  <text x="60" y="256" font-family="monospace" font-size="14" fill="#8cc2ff">7+ yrs production systems</text>
  <text x="330" y="256" font-family="monospace" font-size="14" fill="#50fa7b">1,000+ sites run my plugin</text>
  <text x="610" y="256" font-family="monospace" font-size="14" fill="#ffcc00">98/100 rating</text>
  <text x="780" y="256" font-family="monospace" font-size="14" fill="#8cc2ff">FR · SG · ID</text>

  <!-- blinking cursor -->
  <rect x="60" y="272" width="9" height="16" fill="url(#cursor)">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.99;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
